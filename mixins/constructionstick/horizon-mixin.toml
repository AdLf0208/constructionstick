[mod]
id = "constructionstick"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The content half is inside this bundle (`data/constructionstick-content.hmod`, the built
# `content/constructionstick.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the sticks and the code. The registry keeps one file per
# project, so a split port could not be listed; AE2 ships the same pattern
# (`docs/native-mods.md`, "Data files").
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# The pure plane planner (standalone crate lib, injected as
# `crate::game::constructionstick`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "constructionstick"
source = "runtime.rs"

# Game-side glue: the inventory/placement/durability bridge.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "constructionstick_state"
source = "support.rs"

# A right click on a block with a construction stick claims the use and builds
# the plane (slice 1: construction mode only).
[[injection]]
id = "use-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]
